<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator - SkillCraft Task 02</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- TITLE -->
        <div class="title">
            <h1>Calculator</h1>
            <p>SkillCraft Technology - Task 02</p>
        </div>

        <!-- DISPLAY -->
        <div class="display">
            <div id="previousDisplay"></div>
            <div id="currentDisplay">0</div>
        </div>

        <!-- BUTTONS -->
        <div class="buttons">

            <button class="function" id="clear">AC</button>
            <button class="function" id="delete">DEL</button>
            <button class="operator" id="percent">%</button>
            <button class="operator" data-operator="/">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="*">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="-">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-operator="+">+</button>

            <button class="zero" data-number="0">0</button>
            <button data-number=".">.</button>
            <button class="equal" id="equals">=</button>

        </div>

        <!-- ERROR MESSAGE -->
        <p id="error"></p>

        <!-- HISTORY BUTTON -->
        <button class="history-button" id="historyButton">
            History
        </button>

        <!-- HISTORY PANEL -->
        <div class="history-panel" id="historyPanel">

            <div class="history-header">
                <h2>Calculation History</h2>

                <button id="closeHistory">×</button>
            </div>

            <div id="historyList">

                <p class="empty-history">
                    No calculations yet.
                </p>

            </div>

            <button class="clear-history" id="clearHistory">
                Clear History
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
